name: obscura

services:
  database_postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./postgres_data:/var/lib/postgresql/18/data

  pgweb:
    container_name: pgweb
    restart: always
    image: sosedoff/pgweb
    ports:
      - "8081:8081"
    environment:
      - PGWEB_DATABASE_URL=postgres://${DB_USERNAME}:${DB_PASSWORD}@database_postgres:5432/${DB_NAME}?sslmode=disable
    depends_on:
      - database_postgres

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: always
    command: server /data --console-address ":${S3_SERVER_PORT}"
    ports:
      - "${S3_SERVER_PORT}:${S3_SERVER_PORT}"
      - "${S3_CLIENT_PORT}:${S3_CLIENT_PORT}"
    environment:
      - MINIO_ROOT_USER=${S3_USERNAME}
      - MINIO_ROOT_PASSWORD=${S3_PASSWORD}
    volumes:
      - ./minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:${S3_SERVER_PORT}/minio/health/live",
        ]
      interval: 5s
      timeout: 10s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:${S3_SERVER_PORT} ${S3_USERNAME} ${S3_PASSWORD};
      /usr/bin/mc mb myminio/${S3_BUCKET};
      exit 0;
      "
