<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Opening App...</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@600&display=swap");

      body {
        margin: 0;
        padding: 0;
        background-color: #fafafa;
        font-family: "Inter", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #1b1b1b;
      }

      .card {
        background: white;
        padding: 40px 30px;
        width: 90%;
        max-width: 340px;
        border-radius: 24px;
        box-shadow: 0 10px 25px rgba(56, 38, 92, 0.08);
        text-align: center;
      }

      .loader {
        width: 40px;
        height: 40px;
        border: 3px solid #e0e0e0;
        border-top: 3px solid #38265c;
        border-radius: 50%;
        margin: 0 auto 24px auto;
        animation: spin 1s linear infinite;
      }

      h1 {
        font-family: "Poppins", sans-serif;
        font-size: 20px;
        font-weight: 600;
        color: #38265c;
        margin: 0 0 12px 0;
      }

      p {
        font-size: 14px;
        line-height: 1.5;
        color: #666666;
        margin: 0 0 32px 0;
      }

      .btn {
        display: block;
        width: 100%;
        background-color: #38265c;
        color: #ffffff;
        font-family: "Inter", sans-serif;
        font-weight: 500;
        font-size: 16px;
        text-decoration: none;
        padding: 16px 0;
        border-radius: 12px;
        transition: opacity 0.2s ease;
      }

      .btn:active {
        opacity: 0.9;
        transform: scale(0.98);
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="loader"></div>
      <h1>Opening Obscura...</h1>
      <p>We are taking you to the app to reset your password.</p>
      <a href="{{DEEP_LINK}}" class="btn">Open App</a>
    </div>

    <script>
      setTimeout(function () {
        window.location.href = "{{DEEP_LINK}}";
      }, 100);
    </script>
  </body>
</html>
